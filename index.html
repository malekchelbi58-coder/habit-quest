<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF0F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12162B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habit Quest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Habit Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: player card (level, XP, coins) → tabs. "Aujourd'hui" opens on the weekly streak flame, the daily chest, today's habits and the week's challenges. */
:root {
  --bg: #EDF0F7;
  --surface: #FFFFFF;
  --surface-2: #F4F6FB;
  --ink: #1B2140;
  --muted: #5B6387;
  --line: #D7DCEB;
  --xp: #F0592E;
  --xp-soft: #FFE3D8;
  --gold: #B97E0C;
  --gold-bright: #F2B43A;
  --gold-soft: #FCEFCF;
  --good: #23885B;
  --good-soft: #DDF3E8;
  --warn: #B45A12;
  --warn-soft: #FDEBDB;
  --ice: #2E7FB8;
  --ice-soft: #DDEEFA;
  --h-sun: #E79A22; --h-night: #5465E8; --h-ink: #7651D1; --h-coral: #E9553B;
  --h-iron: #3F86A2; --h-leaf: #2F9A5E; --h-berry: #CF3D76; --h-slate: #6B7390;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10132A; --surface: #191D3A; --surface-2: #141832; --ink: #E8EBFA; --muted: #9CA3CA;
    --line: #2B3160; --xp: #FF7A50; --xp-soft: #3A2230; --gold: #F0BE4A; --gold-bright: #F2C14E; --gold-soft: #33301F;
    --good: #4CC98D; --good-soft: #17352C; --warn: #F0A15A; --warn-soft: #3A2A1C; --ice: #6BB8EE; --ice-soft: #1A2E44;
    --h-sun: #F2B046; --h-night: #7E8CFF; --h-ink: #A184F0; --h-coral: #FF7A5E;
    --h-iron: #63AECB; --h-leaf: #52C485; --h-berry: #F06A9E; --h-slate: #98A0C0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10132A; --surface: #191D3A; --surface-2: #141832; --ink: #E8EBFA; --muted: #9CA3CA;
  --line: #2B3160; --xp: #FF7A50; --xp-soft: #3A2230; --gold: #F0BE4A; --gold-bright: #F2C14E; --gold-soft: #33301F;
  --good: #4CC98D; --good-soft: #17352C; --warn: #F0A15A; --warn-soft: #3A2A1C; --ice: #6BB8EE; --ice-soft: #1A2E44;
  --h-sun: #F2B046; --h-night: #7E8CFF; --h-ink: #A184F0; --h-coral: #FF7A5E;
  --h-iron: #63AECB; --h-leaf: #52C485; --h-berry: #F06A9E; --h-slate: #98A0C0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 72px; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--h-night); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.sub { color: var(--muted); font-size: 14px; }
.note { font-size: 13px; color: var(--muted); }

/* Player card */
.player { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
.crest { width: 76px; height: 86px; position: relative; display: grid; place-items: center; }
.crest svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.crest .lvl { position: relative; text-align: center; color: #fff; line-height: 1; }
.crest .lvl small { display: block; font-family: var(--body); font-size: 9px; font-weight: 700; letter-spacing: 0.12em; opacity: 0.9; }
.crest .lvl b { font-family: var(--display); font-size: 32px; font-weight: 800; }
.pinfo { min-width: 0; display: grid; gap: 7px; }
.pinfo h1 { font-size: clamp(20px, 4.2vw, 27px); font-weight: 800; }
.xpbar { height: 12px; background: var(--xp-soft); border-radius: 99px; overflow: hidden; position: relative; }
.xpbar i { position: absolute; inset: 0 auto 0 0; background: var(--xp); border-radius: 99px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.xpline { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.wallet { display: grid; justify-items: center; gap: 2px; padding: 10px 14px; border-radius: 14px; background: var(--gold-soft); color: var(--gold); min-width: 86px; }
.wallet b { font-family: var(--mono); font-size: 22px; }
.wallet span { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.coin { width: 18px; height: 18px; display: inline-block; vertical-align: -3px; }
@media (max-width: 560px) { .player { grid-template-columns: auto 1fr; padding: 16px; } .wallet { grid-column: 1 / -1; grid-template-columns: auto auto auto; justify-content: start; align-items: center; gap: 8px; } }

/* Tabs */
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; overflow-x: auto; scrollbar-width: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tabs button { flex: 1 0 auto; border: 0; background: none; padding: 10px 12px; border-radius: 10px; font-weight: 600; color: var(--muted); font-size: 14px; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
section[role="tabpanel"] { display: grid; gap: 14px; }
.panel-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.panel-head h2 { font-size: 22px; font-weight: 700; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.box h3 { font-size: 17px; font-weight: 700; }

/* Weekly streak hero */
.streak { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.flame { width: 96px; height: 112px; position: relative; }
.flame svg { width: 100%; height: 100%; overflow: visible; }
.flame .fl { transform-origin: 50% 100%; animation: flick 2.4s ease-in-out infinite; }
.flame .fl2 { transform-origin: 50% 100%; animation: flick 1.7s ease-in-out infinite reverse; }
@keyframes flick { 50% { transform: scale(1.04, .96) skewX(-2deg); } }
.flame b { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 30px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.25); }
.flame.out b { color: var(--muted); text-shadow: none; }
.sinfo { min-width: 0; display: grid; gap: 8px; }
.sinfo h2 { font-size: clamp(20px, 4vw, 26px); font-weight: 800; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.chip.fire { background: var(--xp-soft); color: var(--xp); }
.chip.ok { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.gold { background: var(--gold-soft); color: var(--gold); }
.chip.ice { background: var(--ice-soft); color: var(--ice); }
.chip svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.4; }
.seg { display: flex; gap: 4px; }
.seg i { flex: 1; height: 10px; border-radius: 4px; background: var(--line); }
.seg i.on { background: var(--xp); }
.seg i.need { background: var(--xp-soft); outline: 1.5px dashed var(--xp); outline-offset: -1.5px; }
@media (max-width: 520px) { .streak { grid-template-columns: 1fr; justify-items: start; } .flame { width: 80px; height: 94px; } }

/* Chest */
.chest { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.chest.ready { border: 2px solid var(--gold-bright); background: var(--gold-soft); }
.chest svg.ch { width: 52px; height: 46px; }
.chest.ready svg.ch { animation: wiggle 1.6s ease-in-out infinite; }
.chest.opening svg.ch { animation: shake .5s linear infinite; }
@keyframes wiggle { 0%,80%,100% { transform: rotate(0); } 85% { transform: rotate(-6deg); } 90% { transform: rotate(6deg); } 95% { transform: rotate(-3deg); } }
@keyframes shake { 25% { transform: translateX(-3px) rotate(-4deg); } 75% { transform: translateX(3px) rotate(4deg); } }
.chest .t { min-width: 0; display: grid; gap: 3px; }
.chest b { font-size: 15px; }
.minibar { height: 6px; background: var(--surface-2); border-radius: 9px; overflow: hidden; }
.minibar i { display: block; height: 100%; background: var(--gold-bright); border-radius: 9px; }

/* Quest banner */
.quest { border: 1.5px dashed var(--gold); background: var(--gold-soft); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 2px; }
.quest .eyebrow { color: var(--gold); }
.quest p { font-weight: 600; }

/* Habit cards */
.cards { display: grid; gap: 10px; }
.card { --c: var(--h-slate); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; transition: transform .12s ease, border-color .2s, background .2s; }
.card:hover { border-color: var(--c); }
.card:active { transform: scale(.985); }
.card .tick { width: 42px; height: 42px; border-radius: 12px; border: 2.5px solid var(--c); display: grid; place-items: center; transition: background .2s; }
.card .tick svg { width: 22px; height: 22px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; transform: scale(.4); transition: all .25s cubic-bezier(.3,1.6,.5,1); }
.card.done { background: color-mix(in srgb, var(--c) 9%, var(--surface)); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
.card.done .tick { background: var(--c); }
.card.done .tick svg { opacity: 1; transform: scale(1); }
.card .t { min-width: 0; display: grid; gap: 4px; }
.card .t b { font-weight: 600; font-size: 16px; }
.card .why { font-size: 13px; color: var(--muted); font-style: italic; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.reward { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--xp); white-space: nowrap; text-align: right; }
.reward small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
.card.done .reward { color: var(--muted); }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 8px; height: 8px; border-radius: 3px; background: var(--line); }
.pips i.on { background: var(--c); }
.pips i.over { background: var(--warn); }
.tier { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; letter-spacing: .03em; border: 1px solid currentColor; }

/* Challenges */
.chals { display: grid; gap: 8px; }
.chal { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.chal:first-child { border-top: 0; padding-top: 0; }
.chal .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; color: var(--muted); }
.chal.done .dot { background: var(--good); border: 2px solid var(--good); color: #fff; }
.chal .dot svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 3; }
.chal .t { min-width: 0; display: grid; gap: 4px; }
.chal b { font-weight: 600; font-size: 14px; }
.chal.done b { text-decoration: line-through; text-decoration-color: var(--good); color: var(--muted); }

/* Week grid */
.weeknav { display: flex; align-items: center; gap: 8px; }
.iconbtn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.iconbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; }
.gridwrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table.grid { border-collapse: collapse; width: 100%; min-width: 600px; }
.grid th, .grid td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); }
.grid tr:last-child td { border-bottom: 0; }
.grid th { font-size: 12px; font-weight: 600; color: var(--muted); }
.grid th.today { color: var(--xp); }
.grid td.name { text-align: left; padding-left: 14px; font-weight: 600; font-size: 14px; max-width: 220px; }
.grid td.name span { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.cell { --c: var(--h-slate); width: 34px; height: 34px; border-radius: 10px; border: 2px solid color-mix(in srgb, var(--c) 55%, var(--line)); background: transparent; display: inline-grid; place-items: center; }
.cell.on { background: var(--c); border-color: var(--c); }
.cell svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3; fill: none; }
.cell:disabled { opacity: .3; cursor: default; border-style: dashed; }
.status { font-size: 12px; font-weight: 700; white-space: nowrap; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-family: var(--mono); font-size: 19px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.review label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
textarea, input[type="text"], input[type="number"], select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 54px; }

/* Progress */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.badge { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.medal { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); border: 2px dashed var(--line); }
.medal svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
.badge.won .medal { background: var(--gold-bright); color: #fff; border: 2px solid var(--gold-bright); box-shadow: 0 0 0 4px var(--gold-soft); }
.badge b { display: block; font-size: 14px; }
.badge small { color: var(--muted); font-size: 12px; display: block; }
.chart svg { width: 100%; height: auto; display: block; }
.mastery { display: grid; gap: 12px; }
.mrow { --c: var(--h-slate); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.mrow .bar { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 9px; overflow: hidden; position: relative; }
.mrow .bar i { display: block; height: 100%; background: var(--c); border-radius: 9px; }
.mrow .bar s { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface); }
.mrow b { font-size: 14px; }
.mrow small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }

/* Shop */
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; align-content: space-between; }
.item b { font-size: 15px; }
.item .price { font-family: var(--mono); font-weight: 700; color: var(--gold); display: inline-flex; align-items: center; gap: 4px; }
.item .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.hist { display: grid; gap: 6px; }
.hist div { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 6px 0; border-top: 1px solid var(--line); }

/* Habits settings */
.hlist { display: grid; gap: 10px; }
.hrow { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; }
.hrow .line { display: grid; grid-template-columns: 1fr 160px 90px; gap: 8px; }
.hrow .line.two { grid-template-columns: 1fr 1fr; }
.hrow .line2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
@media (max-width: 560px) { .hrow .line { grid-template-columns: 1fr 1fr; } .hrow .line > :first-child { grid-column: 1 / -1; } .hrow .line.two { grid-template-columns: 1fr; } }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.sw { width: 24px; height: 24px; border-radius: 8px; border: 2px solid transparent; background: var(--c); }
.sw[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--surface) inset; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.gold { background: var(--gold-bright); color: #2A1E00; border-color: var(--gold-bright); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.danger { color: var(--h-coral); }
.fieldlab { font-size: 12px; color: var(--muted); font-weight: 600; display: grid; gap: 4px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }

/* States, toasts, effects */
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 28px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.banner { font-size: 13px; padding: 8px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); }
.toasts { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; z-index: 40; width: min(440px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 12px; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; align-items: center; animation: tin .3s ease both; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.toast b { color: var(--xp); font-family: var(--mono); white-space: nowrap; }
@keyframes tin { from { opacity: 0; transform: translateY(10px); } }
.float { position: fixed; z-index: 45; font-family: var(--mono); font-weight: 700; color: var(--xp); pointer-events: none; animation: up 1s ease-out forwards; font-size: 16px; }
@keyframes up { to { transform: translateY(-46px); opacity: 0; } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 44; width: 100%; height: 100%; }
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(4px); padding: 16px; }
.overlay .pop { background: var(--surface); border: 2px solid var(--gold-bright); border-radius: 22px; padding: 28px 30px; text-align: center; display: grid; gap: 8px; justify-items: center; animation: pop .45s cubic-bezier(.3,1.6,.5,1) both; max-width: 360px; }
.overlay h2 { font-size: 40px; font-weight: 800; color: var(--gold); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* installed-app additions */
[hidden] { display: none !important; }
body { margin: 0; }
.wrap { padding-top: max(20px, env(safe-area-inset-top, 0px)); }
input[type="email"], input[type="password"] { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; font: inherit; color: inherit; }
.syncline { justify-self: end; font: 500 12px/1 var(--body); color: var(--muted); background: none; border: 0; padding: 2px 4px; margin: -8px 0 -6px; cursor: pointer; }
.syncline::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }
.syncline.off::before { background: var(--muted); }
.syncline.err { color: var(--warn); } .syncline.err::before { background: var(--warn); }
.auth { max-width: 420px; justify-self: center; width: 100%; text-align: left; justify-items: stretch; }
.auth h2, .auth > .sub { text-align: center; }
.fld { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
.auth .row, .acct .row, .empty .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.acct { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 10px; margin-top: 16px; }
.acct .row { justify-content: flex-start; }
</style>
</head>
<body>

<div class="wrap">
  <header class="player" aria-live="polite">
    <div class="crest" aria-hidden="true">
      <svg viewBox="0 0 92 104"><path d="M46 3 L87 18 V52 C87 77 68 94 46 101 C24 94 5 77 5 52 V18 Z" fill="var(--xp)"/><path d="M46 11 L80 23.5 V52 C80 72 65 86.5 46 93 C27 86.5 12 72 12 52 V23.5 Z" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/></svg>
      <div class="lvl"><small>NIVEAU</small><b class="num" id="lvl">–</b></div>
    </div>
    <div class="pinfo">
      <div class="eyebrow" id="rank">Chargement de ta progression…</div>
      <h1>Habit Quest</h1>
      <div class="xpbar" role="progressbar" aria-label="XP vers le niveau suivant" id="xpbar" aria-valuemin="0" aria-valuemax="100"><i id="xpfill" style="width:0%"></i></div>
      <div class="xpline"><span class="num" id="xptext">0 / 100 XP</span><span id="xptotal" class="num"></span></div>
    </div>
    <div class="wallet" title="Pièces à dépenser dans la boutique">
      <svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--gold-bright)"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.6"/></svg>
      <b id="coins">–</b><span>pièces</span>
    </div>
  </header>

  <div id="banner" hidden></div>
  <button type="button" id="syncline" class="syncline" hidden></button>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-today" aria-controls="p-today" aria-selected="true">Aujourd'hui</button>
    <button role="tab" id="tab-week" aria-controls="p-week" aria-selected="false">Semaine</button>
    <button role="tab" id="tab-progress" aria-controls="p-progress" aria-selected="false">Progrès</button>
    <button role="tab" id="tab-shop" aria-controls="p-shop" aria-selected="false">Boutique</button>
    <button role="tab" id="tab-habits" aria-controls="p-habits" aria-selected="false">Habitudes</button>
  </nav>

  <section role="tabpanel" id="p-today" aria-labelledby="tab-today"></section>
  <section role="tabpanel" id="p-week" aria-labelledby="tab-week" hidden></section>
  <section role="tabpanel" id="p-progress" aria-labelledby="tab-progress" hidden></section>
  <section role="tabpanel" id="p-shop" aria-labelledby="tab-shop" hidden></section>
  <section role="tabpanel" id="p-habits" aria-labelledby="tab-habits" hidden></section>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
(() => {
"use strict";
// ---------- rules of the game ----------
const XP = { check: 10, goal: 50, perfect: 50, limit: 30, combo: 20 };
const COMBO_MIN = 5;          // habits in one day for a combo
const CHEST_MIN = 4;          // habits in one day to earn the daily chest
const MULT_STEP = 0.1, MULT_MAX = 2;   // +10 % XP per week of streak, up to x2
const JOKER_EVERY = 3, JOKER_MAX = 2;  // one joker every 3 validated weeks
const COIN_RATE = 10;         // 1 coin per 10 XP
const TIERS = [ { n: 0, name: "Novice" }, { n: 5, name: "Bronze" }, { n: 15, name: "Argent" }, { n: 30, name: "Or" }, { n: 50, name: "Platine" }, { n: 66, name: "Ancrée" } ];
const TIER_COLORS = { Novice: "var(--muted)", Bronze: "#B0713A", Argent: "#7F8BA6", Or: "var(--gold)", Platine: "var(--ice)", Ancrée: "var(--good)" };
const COLORS = ["sun","night","ink","coral","iron","leaf","berry","slate"];
const RANKS = ["Recrue","Recrue","Sentinelle","Sentinelle","Stratège","Stratège","Athlète","Athlète","Virtuose","Virtuose","Légende","Légende","Mythe"];
const DAYS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const DAYS_LONG = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const MONTHS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const DEFAULT_HABITS = [
  { id: "wake", name: "Réveil et hors du lit avant 8 h", kind: "daily", target: 7, color: "sun" },
  { id: "read", name: "Lire 5 pages avant de dormir", kind: "goal", target: 5, color: "ink" },
  { id: "run", name: "Courir", kind: "goal", target: 3, color: "coral" },
];
const REWARD_IDEAS = [
  { name: "Un épisode de série sans culpabilité", cost: 15 },
  { name: "Un café ou une pâtisserie dehors", cost: 25 },
  { name: "Une soirée jeux vidéo", cost: 40 },
  { name: "Un resto avec des amis", cost: 80 },
  { name: "Un nouvel équipement de sport", cost: 200 },
];
const I = {
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  shield: '<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/></svg>',
  bolt: '<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
};

// ---------- dates ----------
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const mondayOf = s => { const d = parse(s); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd); return iso(d); };
const dayIdx = s => (parse(s).getDay()+6)%7;
const fmt = s => { const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const todayISO = () => iso(new Date());
// deterministic randomness, so a week's challenges and a day's chest never change on reload
function seeded(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }

// ---------- state & sync ----------
// The page keeps everything in localStorage (works offline) and, when signed in,
// mirrors it to one Supabase row per user. Unsynced changes are kept as a patch
// so they can be replayed on top of a newer version written by another device.
const CFG = window.HQ_CONFIG || {};
const LS = { state: "hq-state", pending: "hq-pending", meta: "hq-meta" };
let state = null, mode = "loading";
let pending = null, syncTimer = null, syncing = false, forceReplace = false;
let sb = null, session = null, syncInfo = { s: "idle" };
let tab = "today", viewWeek = mondayOf(todayISO());
let confirmKey = null;   // inline confirmation (archive habit / buy reward)
try { tab = localStorage.getItem("hq-tab") || "today"; } catch (e) {}
if (!["today","week","progress","shop","habits"].includes(tab)) tab = "today";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const isObj = v => v && typeof v === "object" && !Array.isArray(v);
function merge(a, b) { const out = isObj(a) ? { ...a } : {}; for (const k in b) out[k] = isObj(b[k]) && isObj(out[k]) ? merge(out[k], b[k]) : (isObj(b[k]) ? merge({}, b[k]) : b[k]); return out; }

const lsGet = k => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const clean = st => { const o = { ...st }; delete o._new; return o; };
function saveLocal() { lsSet(LS.state, state && clean(state)); lsSet(LS.pending, pending); }

function commit(patch, opts = {}) {
  const before = compute(state);
  state = merge(state, patch);
  pending = merge(pending || {}, patch);
  saveLocal();
  scheduleSync(600);
  const after = compute(state);
  if (!opts.silent) render();
  return { before, after };
}
function scheduleSync(ms) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }
function setSync(st, extra) { syncInfo = { s: st, at: Date.now(), ...(extra || {}) }; paintSync(); }
function paintSync() {
  const el = document.getElementById("syncline"); if (!el) return;
  if (!sb || !session || mode === "login") { el.hidden = true; return; }
  el.hidden = false;
  const t = syncInfo.at ? new Date(syncInfo.at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "";
  let txt = "Synchroniser", cls = "";
  if (!navigator.onLine) { txt = pending ? "Hors ligne · tes changements partiront au retour du réseau" : "Hors ligne"; cls = "off"; }
  else if (syncInfo.s === "sync") txt = "Synchronisation…";
  else if (syncInfo.s === "err") { txt = "Synchro impossible · toucher pour réessayer"; cls = "err"; }
  else if (syncInfo.s === "ok") txt = `Synchronisé à ${t}`;
  el.className = "syncline " + cls; el.textContent = txt;
  el.title = syncInfo.s === "err" && syncInfo.msg ? syncInfo.msg : "";
}
function softRender() {
  const a = document.activeElement;
  if (a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)) return; // don't wipe what is being typed
  if (document.querySelector(".overlay")) return;
  render();
}
async function sync() {
  if (!sb || !session) return;
  if (syncing) { scheduleSync(800); return; }
  if (!navigator.onLine) { paintSync(); return; }
  syncing = true; setSync("sync");
  const uid = session.user.id;
  try {
    const meta = lsGet(LS.meta) || {};
    if (!forceReplace) {
      const { data: row, error } = await sb.from("habit_state").select("data, updated_at").eq("user_id", uid).maybeSingle();
      if (error) throw error;
      if (row && row.updated_at !== meta.remoteAt) {
        // another device saved since our last sync: take its version, replay ours on top
        state = pending ? merge(row.data, pending) : row.data;
        if (!pending) lsSet(LS.meta, { ...meta, remoteAt: row.updated_at, uid });
        saveLocal();
        if (mode !== "login") mode = "ready";
        softRender();
      } else if (!row && !state) {
        mode = "missing"; render(); setSync("ok"); return;
      } else if (!row) {
        pending = pending || {}; // nothing online yet: upload what this device has
      }
    }
    if ((pending || forceReplace) && state) {
      const sent = pending, wasForce = forceReplace;
      pending = null; forceReplace = false; saveLocal();
      const { data: up, error } = await sb.from("habit_state")
        .upsert({ user_id: uid, data: clean(state), updated_at: new Date().toISOString() })
        .select("updated_at").single();
      if (error) { pending = merge(sent || {}, pending || {}); forceReplace = wasForce; saveLocal(); throw error; }
      lsSet(LS.meta, { ...(lsGet(LS.meta) || {}), remoteAt: up.updated_at, uid });
    }
    if (mode === "loading") { mode = state ? "ready" : "missing"; render(); }
    setSync("ok");
  } catch (e) {
    console.warn("sync", e);
    setSync("err", { msg: e && (e.message || e.code) });
    if (mode === "loading") { mode = state ? "ready" : "missing"; render(); }
  } finally {
    syncing = false;
    if (pending && navigator.onLine && syncInfo.s !== "err") scheduleSync(400);
  }
}

// ---------- account, import, export ----------
const authErr = e => {
  const m = (e && e.message) || "";
  if (/invalid login/i.test(m)) return "E-mail ou mot de passe incorrect.";
  if (/not confirmed/i.test(m)) return "Confirme d'abord ton adresse avec le lien reçu par e-mail.";
  if (/already registered|already exists/i.test(m)) return "Ce compte existe déjà : utilise « Se connecter ».";
  if (/signups? not allowed|disabled/i.test(m)) return "La création de compte est désactivée.";
  if (/password/i.test(m) && /6|characters|short/i.test(m)) return "Le mot de passe doit faire au moins 6 caractères.";
  if (/fetch|network/i.test(m)) return "Pas de connexion internet.";
  return "Erreur : " + m;
};
function renderLogin() {
  for (const t of ["today","week","progress","shop","habits"]) $("p-" + t).hidden = t !== "today";
  $("rank").textContent = "Connecte-toi pour retrouver ta progression";
  const p = $("p-today");
  if (p.querySelector("#auth")) return;
  p.innerHTML = `<form class="empty auth" id="auth" novalidate>
    <h2>Connexion</h2>
    <p class="sub">Le même compte sur ton ordi et ton téléphone : ta progression se synchronise entre les deux.</p>
    <label class="fld">E-mail<input type="email" id="au-email" autocomplete="username" inputmode="email" required></label>
    <label class="fld">Mot de passe<input type="password" id="au-pass" autocomplete="current-password" minlength="6" required></label>
    <div class="row"><button class="btn primary" type="submit">Se connecter</button><button class="btn" type="button" id="au-signup">Créer mon compte</button></div>
    <p class="sub" id="au-msg" role="status"></p>
  </form>`;
  const msg = t => { $("au-msg").textContent = t; };
  const creds = () => ({ email: $("au-email").value.trim(), password: $("au-pass").value });
  const valid = () => { const c = creds(); if (!/^\S+@\S+\.\S+$/.test(c.email)) { msg("Entre une adresse e-mail valide."); return null; } if (c.password.length < 6) { msg("Le mot de passe doit faire au moins 6 caractères."); return null; } return c; };
  $("auth").onsubmit = async e => {
    e.preventDefault(); const c = valid(); if (!c) return;
    msg("Connexion…");
    try { const { error } = await sb.auth.signInWithPassword(c); if (error) msg(authErr(error)); } catch (err) { msg(authErr(err)); }
  };
  $("au-signup").onclick = async () => {
    const c = valid(); if (!c) return;
    msg("Création du compte…");
    try {
      const { data, error } = await sb.auth.signUp(c);
      if (error) return msg(authErr(error));
      if (!data.session) msg("Compte créé. Clique sur le lien de confirmation reçu par e-mail, puis reviens ici et connecte-toi.");
    } catch (err) { msg(authErr(err)); }
  };
}
function renderAccount() {
  const box = document.createElement("div"); box.className = "acct";
  const on = sb && session;
  box.innerHTML = `<h2>Compte et sauvegarde</h2>
    <p class="sub">${on ? `Connecté avec <b>${esc(session.user.email)}</b>. Ta progression se synchronise entre tes appareils.` : "Synchronisation non configurée : ta progression reste sur cet appareil."}</p>
    <div class="row"><button class="btn" id="acc-exp">Exporter ma progression</button><button class="btn" id="acc-imp">Importer une sauvegarde</button>${on ? `<button class="btn danger" id="acc-out">Se déconnecter</button>` : ""}</div>`;
  $("p-habits").appendChild(box);
  $("acc-exp").onclick = exportState;
  $("acc-imp").onclick = pickImport;
  if (on) $("acc-out").onclick = async () => {
    if (pending && !confirm("Certains changements ne sont pas encore synchronisés et resteront seulement sur cet appareil. Se déconnecter quand même ?")) return;
    await sb.auth.signOut();
  };
}
function exportState() {
  if (!state) return;
  const blob = new Blob([JSON.stringify(clean(state), null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `habit-quest-${todayISO()}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function pickImport() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    let d;
    try { d = JSON.parse(await f.text()); } catch (e) { d = null; }
    if (!d || !Array.isArray(d.habits) || !isObj(d.checks)) { toast("Ce fichier n'est pas une sauvegarde Habit Quest"); return; }
    if (state && !confirm("Remplacer ta progression actuelle par celle de ce fichier ?")) return;
    state = d; pending = null; forceReplace = true; saveLocal();
    mode = "ready"; render(); toast("Progression importée");
    sync();
  };
  inp.click();
}

// ---------- game engine ----------
const activeHabits = s => (s.habits || []).filter(h => !h.archived);
const targetFor = (s, h, wk) => s.weeks?.[wk]?.targets?.[h.id] ?? h.target;
const appliesTo = (h, wk) => !h.since || h.since <= addDays(wk, 6);
function levelFromXP(xp) { let lvl = 1, need = 100, floor = 0; while (xp >= floor + need) { floor += need; lvl++; need = 100 + 50*(lvl-1); } return { lvl, into: xp - floor, need }; }
const tierOf = n => { let t = 0; for (let i = 0; i < TIERS.length; i++) if (n >= TIERS[i].n) t = i; return { i: t, ...TIERS[t], next: TIERS[t+1] }; };
const chestAmount = date => { const r = seeded("chest" + date)(); return r < .05 ? 120 : r < .3 ? 40 + Math.floor(r * 60) : 15 + Math.floor(r * 50); };

// Weekly challenges: three per week, drawn from the week's date so they are stable.
function challengesFor(s, wk, byId, prevCounts) {
  const rnd = seeded("chal" + wk);
  const hs = (s.habits || []).filter(h => appliesTo(h, wk) && !h.archived && h.kind !== "limit" && (!h.since || h.since <= wk));
  if (!hs.length) return [];
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const days = [...Array(7)].map((_, i) => (s.checks?.[addDays(wk, i)] || []).filter(id => byId[id]));
  const has = (i, id) => days[i].includes(id);
  const goals = hs.filter(h => h.kind === "goal");
  const tpl = [
    () => { const h = pick(hs); const c = [0,1,2].filter(i => has(i, h.id)).length; return { key: "early", text: `Lancer la semaine : « ${h.name} » avant mercredi soir`, v: Math.min(c, 1), goal: 1, xp: 30, h }; },
    () => { const h = pick(hs); let best = 0, run = 0; for (let i = 0; i < 7; i++) { run = has(i, h.id) ? run + 1 : 0; best = Math.max(best, run); } return { key: "chain", text: `Enchaîner 3 jours d'affilée de « ${h.name} »`, v: Math.min(best, 3), goal: 3, xp: 40, h }; },
    () => { const c = days.filter(d => d.some(id => byId[id].kind !== "limit")).length; return { key: "every", text: "Cocher au moins une habitude chaque jour de la semaine", v: c, goal: 7, xp: 50 }; },
    () => { const h = pick(hs); const c = [5,6].filter(i => has(i, h.id)).length; return { key: "weekend", text: `Week-end actif : « ${h.name} » samedi ou dimanche`, v: Math.min(c, 1), goal: 1, xp: 30, h }; },
    () => { const best = Math.max(0, ...days.map(d => d.filter(id => byId[id].kind !== "limit").length)); return hs.length >= COMBO_MIN ? { key: "combo", text: `Faire un combo : ${COMBO_MIN} habitudes dans la même journée`, v: Math.min(best, COMBO_MIN), goal: COMBO_MIN, xp: 40 } : null; },
    () => { if (!goals.length) return null; const h = pick(goals); const t = targetFor(s, h, wk); if (t > 4) return null; const c = [0,1,2,3].filter(i => has(i, h.id)).length; return { key: "fast", text: `Boucler l'objectif « ${h.name} » (${t}×) avant vendredi`, v: Math.min(c, t), goal: t, xp: 60, h }; },
    () => { const h = pick(hs); const last = prevCounts?.[h.id] || 0; if (last >= 7 || !prevCounts) return null; const c = days.filter(d => d.includes(h.id)).length; return { key: "beat", text: `Faire mieux que la semaine dernière sur « ${h.name} » (${last + 1}× ou plus)`, v: Math.min(c, last + 1), goal: last + 1, xp: 40, h }; },
  ];
  const out = [], used = new Set();
  for (let tries = 0; out.length < 3 && tries < 40; tries++) {
    const i = Math.floor(rnd() * tpl.length); if (used.has(i)) continue;
    const c = tpl[i](); if (!c) { used.add(i); continue; }
    used.add(i); out.push({ ...c, id: wk + ":" + c.key, done: c.v >= c.goal });
  }
  return out;
}

function compute(s) {
  if (!s) return null;
  const today = todayISO(), thisWeek = mondayOf(today);
  const checks = s.checks || {}, habits = s.habits || [];
  const byId = Object.fromEntries(habits.map(h => [h.id, h]));
  const first = mondayOf(s.startedOn || Object.keys(checks).sort()[0] || today);
  const weeks = []; for (let w = first; w <= thisWeek; w = addDays(w, 7)) weeks.push(w);
  const totals = {}, bestDays = {};
  let xp = 0, combos = 0, totalChecks = 0, perfectWeeks = 0, limitOk = 0, reviews = 0, chestsOpened = 0, chalDone = 0, jokersEarned = 0, jokersUsed = 0;
  const allDates = Object.keys(checks).sort();
  for (const d of allDates) {
    let positive = 0;
    for (const id of (checks[d] || [])) { if (!byId[id]) continue; totals[id] = (totals[id]||0) + 1; if (byId[id].kind !== "limit") { positive++; totalChecks++; } }
    if (positive >= COMBO_MIN) combos++;
  }
  const weekInfo = {};
  let streak = 0, bestStreak = 0, validated = 0, jokers = 0, prevCounts = null;
  for (const w of weeks) {
    const info = { wk: w, base: 0, bonus: 0, counts: {}, goalsHit: 0, goalsTotal: 0, hits: {}, positive: 0 };
    const done = w < thisWeek;
    for (let i = 0; i < 7; i++) {
      const d = addDays(w, i); let positive = 0;
      for (const id of (checks[d] || [])) { if (!byId[id]) continue; info.counts[id] = (info.counts[id]||0) + 1; if (byId[id].kind !== "limit") { info.base += XP.check; positive++; } }
      info.positive += positive;
      if (positive >= COMBO_MIN) info.base += XP.combo;
      const ch = s.chests?.[d]; if (ch) { info.bonus += ch; chestsOpened++; }
    }
    for (const h of habits) {
      if (!appliesTo(h, w)) continue;
      if (h.archived && !info.counts[h.id]) continue;
      const c = info.counts[h.id] || 0, t = targetFor(s, h, w);
      if (h.kind === "goal") { info.goalsTotal++; if (c >= t) { info.goalsHit++; info.base += XP.goal; info.hits[h.id] = true; } }
      if (h.kind === "daily" && c >= 7) { info.base += XP.perfect; info.hits[h.id] = true; }
      if (h.kind === "limit" && done && c <= t) { info.base += XP.limit; info.hits[h.id] = true; limitOk++; }
    }
    info.challenges = challengesFor(s, w, byId, prevCounts);
    for (const c of info.challenges) if (c.done) { info.bonus += c.xp; chalDone++; }
    // weekly streak: a week is validated when at least half of its weekly goals are reached
    info.need = info.goalsTotal ? Math.ceil(info.goalsTotal / 2) : 0;
    info.valid = info.goalsTotal ? info.goalsHit >= info.need : info.positive >= 7;
    info.streakBefore = streak;
    info.mult = Math.min(MULT_MAX, 1 + MULT_STEP * streak);
    info.jokersBefore = jokers;
    if (done) {
      if (info.valid) { streak++; validated++; info.status = "ok"; if (validated % JOKER_EVERY === 0 && jokers < JOKER_MAX) { jokers++; jokersEarned++; info.jokerEarned = true; } }
      else if (jokers > 0) { jokers--; jokersUsed++; info.status = "joker"; }
      else { info.status = streak > 0 ? "broken" : "miss"; info.lost = streak; streak = 0; }
      bestStreak = Math.max(bestStreak, streak);
    } else info.status = info.valid ? "ok-now" : "pending";
    info.xp = Math.round(info.base * info.mult) + info.bonus;
    if (info.goalsTotal && info.goalsHit === info.goalsTotal) perfectWeeks++;
    const r = s.weeks?.[w]?.review; if (r && (r.good || r.hard || r.focus)) reviews++;
    xp += info.xp; weekInfo[w] = info; prevCounts = info.counts;
  }
  const curWeek = weekInfo[thisWeek];
  const liveStreak = streak + (curWeek?.valid ? 1 : 0);
  bestStreak = Math.max(bestStreak, liveStreak);
  // per-habit streaks
  const hStreak = {};
  for (const h of habits) {
    if (h.kind === "daily") {
      let best = 0, run = 0, prev = null;
      for (const d of allDates) { if (!(checks[d]||[]).includes(h.id)) continue; run = prev && addDays(prev, 1) === d ? run + 1 : 1; prev = d; best = Math.max(best, run); }
      let cur = 0, d = (checks[today]||[]).includes(h.id) ? today : addDays(today, -1);
      while ((checks[d]||[]).includes(h.id)) { cur++; d = addDays(d, -1); }
      hStreak[h.id] = { cur, best, unit: "j" }; bestDays[h.id] = best;
    } else {
      let best = 0, run = 0;
      for (const w of weeks) { const hit = weekInfo[w].hits[h.id]; if (w === thisWeek && !hit) continue; run = hit ? run + 1 : 0; best = Math.max(best, run); }
      const list = weeks.slice(); if (!weekInfo[thisWeek]?.hits[h.id]) list.pop();
      let cur = 0; for (let i = list.length - 1; i >= 0 && weekInfo[list[i]].hits[h.id]; i--) cur++;
      hStreak[h.id] = { cur, best, unit: "sem." };
    }
  }
  const spent = (s.purchases || []).reduce((a, p) => a + (p.cost || 0), 0);
  const recordXP = Math.max(0, ...weeks.filter(w => w < thisWeek).map(w => weekInfo[w].xp));
  const maxWeek = id => Math.max(0, ...weeks.map(w => weekInfo[w].counts[id] || 0));
  const lv = levelFromXP(xp);
  const maxTotal = Math.max(0, ...habits.filter(h => h.kind !== "limit").map(h => totals[h.id] || 0));
  const stats = { totals, combos, totalChecks, perfectWeeks, limitOk, reviews, bestDays, maxWeek, lvl: lv.lvl, bestStreak, jokersEarned, chestsOpened, chalDone, maxTotal, bought: (s.purchases || []).length };
  return { xp, ...lv, weeks, weekInfo, thisWeek, streak, liveStreak, bestStreak, jokers, hStreak, coins: Math.floor(xp / COIN_RATE) - spent, recordXP, stats, badges: badgesFor(stats, byId) };
}

// ---------- actions ----------
function toggle(date, id, evt) {
  if (date > todayISO()) return;
  const h = state.habits.find(x => x.id === id);
  const cur = (state.checks?.[date] || []).slice();
  const i = cur.indexOf(id), adding = i < 0;
  if (adding) cur.push(id); else cur.splice(i, 1);
  const { before, after } = commit({ checks: { [date]: cur } });
  if (!adding) return;
  if (h.kind !== "limit") { const m = after.weekInfo[mondayOf(date)]?.mult || 1; floatXP(evt, `+${Math.round(XP.check * m)} XP`); }
  celebrate(before, after, h, mondayOf(date), date);
}

function celebrate(before, after, h, wk, date) {
  const b = before.weekInfo[wk], a = after.weekInfo[wk];
  let party = false;
  if (a && b) {
    if (a.hits[h.id] && !b.hits[h.id] && h.kind !== "limit") { toast(h.kind === "daily" ? `7 jours sur 7 : ${esc(h.name)}` : `Objectif atteint : ${esc(h.name)}`, `+${Math.round((h.kind === "daily" ? XP.perfect : XP.goal) * a.mult)}`); party = true; }
    if (a.valid && !b.valid) { toast(wk === after.thisWeek ? `Semaine validée ! Ta série passe à ${after.liveStreak} semaine${after.liveStreak > 1 ? "s" : ""}` : "Semaine validée après coup", ""); party = true; }
    if (a.goalsTotal && a.goalsHit === a.goalsTotal && b.goalsHit !== b.goalsTotal) toast("Semaine parfaite : tous les objectifs sont atteints", "");
    for (const c of a.challenges) if (c.done && !b.challenges.find(x => x.id === c.id)?.done) { toast(`Défi réussi : ${esc(c.text)}`, `+${c.xp}`); party = true; }
    const pa = (state.checks?.[date] || []).filter(id => state.habits.find(x => x.id === id && x.kind !== "limit")).length;
    if (h.kind !== "limit" && pa === COMBO_MIN) toast(`Combo : ${COMBO_MIN} habitudes aujourd'hui`, `+${Math.round(XP.combo * a.mult)}`);
    if (h.kind !== "limit" && pa === CHEST_MIN && date === todayISO() && !state.chests?.[date]) toast("Le coffre du jour est prêt à être ouvert", "");
    if (h.kind === "limit") { const c = a.counts[h.id] || 0, t = targetFor(state, h, wk); toast(c > t ? `Limite dépassée cette semaine (${c}/${t}). Pas de bonus, on repart lundi.` : `Noté : ${c}/${t} cette semaine. Reste sous la limite pour +${XP.limit} XP.`, ""); }
  }
  for (const nb of after.badges.filter(x => x.won && !before.badges.find(y => y.id === x.id && y.won))) { toast(`Trophée débloqué : ${esc(nb.name)}`, ""); party = true; }
  if (party) confetti();
  if (after.lvl > before.lvl) levelUp(after.lvl);
}

function openChest(date, btn) {
  const amount = chestAmount(date);
  const el = btn.closest(".chest"); el.classList.add("opening"); btn.disabled = true;
  setTimeout(() => {

    const rare = amount >= 100 ? "Coffre légendaire !" : amount >= 40 ? "Beau butin !" : "Coffre ouvert";
    popup(rare, `+${amount} XP`, amount >= 100 ? "Une chance sur vingt. Profite." : "Reviens demain : chaque coffre est différent.");

}

function updateHabit(id, patch) {
  const habits = state.habits.map(h => h.id === id ? { ...h, ...patch } : h);
  const extra = {};
  if ("target" in patch) {
    const old = state.habits.find(h => h.id === id).target, cw = mondayOf(todayISO()), c = compute(state), weeks = {};
    for (const w of c.weeks) if (w < cw && state.weeks?.[w]?.targets?.[id] == null) weeks[w] = { targets: { [id]: old } };
    extra.weeks = weeks;
  }
  commit({ habits, ...extra });
}

  const chest = opened
    ? `<div class="chest">${chestSVG}<span class="t"><b>Coffre du jour ouvert : +${opened} XP</b><span class="note">Un nouveau coffre t'attend demain dès ${CHEST_MIN} habitudes cochées.</span></span><span></span></div>`
    : chestReady
    ? `<div class="chest ready">${chestSVG}<span class="t"><b>Le coffre du jour est prêt</b><span class="note">Son contenu varie de 15 à 120 XP.</span></span><button class="btn gold" data-chest="${d}">Ouvrir</button></div>`
    : `<div class="chest">${chestSVG}<span class="t"><b>Coffre du jour : encore ${CHEST_MIN - doneCount} habitude${CHEST_MIN - doneCount > 1 ? "s" : ""}</b><span class="minibar"><i style="width:${100 * doneCount / CHEST_MIN}%"></i></span></span><span class="reward num" style="color:var(--gold)">${doneCount}/${CHEST_MIN}</span></div>`;
  const ychest = ydayChest ? `<div class="chest ready">${chestSVG}<span class="t"><b>Le coffre d'hier n'a pas été ouvert</b><span class="note">Dernière chance, il disparaît à minuit.</span></span><button class="btn gold" data-chest="${yday}">Ouvrir</button></div>` : "";
  const focus = state.weeks?.[addDays(wk, -7)]?.review?.focus;
  const card = h => {
    const on = done.includes(h.id);
    const why = h.cue || h.identity ? `<span class="why">${esc(h.cue || "")}${h.cue && h.identity ? " · " : ""}${h.identity ? "Je deviens quelqu'un qui " + esc(h.identity) : ""}</span>` : "";
    return `<button class="card ${on ? "done" : ""}" style="--c:var(--h-${h.color})" data-toggle="${h.id}" aria-pressed="${on}">
      <span class="tick">${I.check}</span>
      <span class="t"><b>${esc(h.name)}</b>${why}<span class="meta">${habitChips(c, h, wk)}</span></span>
      <span class="reward">${h.kind === "limit" ? (on ? "Noté" : "Noter") : (on ? "Fait" : `+${Math.round(XP.check * info.mult)} XP`)}</span>
    </button>`;
  };
  $("p-today").innerHTML = `
    <div class="streak">
      <div class="flame ${c.liveStreak ? "" : "out"}">${flameSVG(c.liveStreak)}<b class="num">${c.liveStreak}</b></div>
      <div class="sinfo">
        <div class="eyebrow">Série de semaines · ${DAYS_LONG[dayIdx(d)]} ${fmt(d)}</div>
        <h2>${headline}</h2>
        <div class="chips">
          <span class="chip fire">${I.bolt} XP ×${info.mult.toFixed(1)}</span>
          <span class="chip ice">${I.shield} ${c.jokers} joker${c.jokers > 1 ? "s" : ""}</span>
          <span class="chip">Record : ${c.bestStreak} sem.</span>
        </div>
        ${info.goalsTotal ? `<div class="seg" aria-label="${info.goalsHit} objectifs sur ${info.goalsTotal}, ${info.need} pour valider">${segs}</div>` : ""}
        <p class="sub">${line}</p>${comeback}
      </div>
    </div>
    ${ychest}${chest}
    ${focus ? `<div class="quest"><span class="eyebrow">Quête de la semaine · ton focus</span><p>${esc(focus)}</p></div>` : ""}
    <div class="panel-head"><h2>Quêtes du jour</h2><span class="sub num">${doneCount}/${pos.length} faites${doneCount >= COMBO_MIN ? " · combo !" : ""}</span></div>
    <div class="cards">${pos.map(card).join("")}</div>
    ${lim.length ? `<div class="eyebrow">À limiter · pas d'XP par case, un bonus si la semaine reste sous la limite</div><div class="cards">${lim.map(card).join("")}</div>` : ""}
    ${info.challenges.length ? `<div class="box"><div class="panel-head"><h3>Défis de la semaine</h3><span class="sub">Nouveaux défis chaque lundi</span></div><div class="chals">${challengeList(info.challenges)}</div></div>` : ""}
    ${habits.length ? "" : `<div class="empty"><b>Aucune habitude active</b><span class="sub">Ajoute-en une dans l'onglet Habitudes.</span></div>`}`;
  const P = $("p-today");
  P.querySelectorAll("[data-toggle]").forEach(b => b.onclick = e => toggle(d, b.dataset.toggle, e));
  P.querySelectorAll("[data-chest]").forEach(b => b.onclick = () => openChest(b.dataset.chest, b));
}

const STATUS = {
  ok: ["Semaine validée", "ok"], joker: ["Sauvée par un joker", "ice"], broken: ["Série perdue", "warn"], miss: ["Non validée", ""],
  "ok-now": ["Validée, en cours", "ok"], pending: ["En cours", ""],
};
function renderWeek(c) {
  const wk = viewWeek, today = todayISO(), first = c.weeks[0];
  const info = c.weekInfo[wk] || { xp: 0, counts: {}, goalsHit: 0, goalsTotal: 0, hits: {}, challenges: [], mult: 1, status: "pending" };
  const habits = (state.habits || []).filter(h => appliesTo(h, wk) && (!h.archived || info.counts[h.id]));
  const rev = state.weeks?.[wk]?.review || {};
  const idx = c.weeks.indexOf(wk) + 1;
  const [stTxt, stCls] = STATUS[info.status] || STATUS.pending;
  const head = `<tr><th></th>${DAYS.map((n, i) => { const d = addDays(wk, i); return `<th class="${d === today ? "today" : ""}">${n}<br><span class="num">${parse(d).getDate()}</span></th>`; }).join("")}<th>Statut</th></tr>`;
  const rows = habits.map(h => {
    const t = targetFor(state, h, wk), cnt = info.counts[h.id] || 0;
    const label = h.kind === "goal" ? `objectif ${t}×` : h.kind === "limit" ? `max ${t}×` : "chaque jour";
    const status = h.kind === "goal" ? (cnt >= t ? `<span class="status" style="color:var(--good)">Atteint</span>` : `<span class="status num">${cnt}/${t}</span>`)
      : h.kind === "limit" ? `<span class="status num" style="color:${cnt > t ? "var(--warn)" : "var(--good)"}">${cnt}/${t}</span>` : `<span class="status num">${cnt}/7</span>`;
    return `<tr><td class="name">${esc(h.name)}<span>${label}</span></td>${DAYS.map((_, i) => {
      const d = addDays(wk, i), on = (state.checks?.[d] || []).includes(h.id);
      return `<td><button class="cell ${on ? "on" : ""}" style="--c:var(--h-${h.color})" data-d="${d}" data-h="${h.id}" aria-label="${esc(h.name)}, ${fmt(d)}" aria-pressed="${on}" ${d > today ? "disabled" : ""}>${on ? I.check : ""}</button></td>`;
    }).join("")}<td>${status}</td></tr>`;
  }).join("");
  const isCur = wk === c.thisWeek;
  $("p-week").innerHTML = `
    <div class="panel-head">
      <div><div class="eyebrow">Semaine ${idx > 0 ? idx : ""}</div><h2>Du ${fmt(wk)} au ${fmt(addDays(wk, 6))}</h2></div>
      <div class="weeknav">
        <button class="iconbtn" id="wprev" aria-label="Semaine précédente" ${wk <= first ? "disabled" : ""}><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="btn" id="wnow">Cette semaine</button>
        <button class="iconbtn" id="wnext" aria-label="Semaine suivante" ${wk >= c.thisWeek ? "disabled" : ""}><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
    <div class="chips"><span class="chip ${stCls}">${stTxt}</span><span class="chip fire">${I.bolt} XP ×${info.mult.toFixed(1)}</span>${info.jokerEarned ? `<span class="chip ice">${I.shield} Joker gagné</span>` : ""}${info.status === "broken" ? `<span class="chip">Série de ${info.lost} sem. terminée</span>` : ""}</div>
    <div class="kpis">
      <div class="stat"><b>${info.xp}</b><span>XP gagnés</span></div>
      <div class="stat"><b>${info.goalsHit}/${info.goalsTotal}</b><span>objectifs (${info.need || 0} pour valider)</span></div>
      <div class="stat"><b>${info.challenges.filter(x => x.done).length}/${info.challenges.length}</b><span>défis réussis</span></div>
      <div class="stat"><b>${c.recordXP}</b><span>record d'XP sur une semaine</span></div>
    </div>
    ${isCur && c.recordXP ? `<div class="box"><div class="panel-head"><h3>Bats ton record</h3><span class="sub num">${info.xp} / ${c.recordXP} XP</span></div><div class="minibar" style="height:10px"><i style="width:${Math.min(100, 100 * info.xp / c.recordXP)}%;background:var(--xp)"></i></div></div>` : ""}
    <div class="gridwrap"><table class="grid">${head}${rows}</table></div>
    ${info.challenges.length ? `<div class="box"><h3>Défis de cette semaine</h3><div class="chals">${challengeList(info.challenges)}</div></div>` : ""}
    <div class="box review">
      <h3>Review de la semaine</h3>
      <label for="rv-good">Ce qui a bien été<textarea id="rv-good" data-f="good">${esc(rev.good)}</textarea></label>
      <label for="rv-hard">Ce qui a été difficile<textarea id="rv-hard" data-f="hard">${esc(rev.hard)}</textarea></label>
      <label for="rv-focus">Focus pour la semaine prochaine (devient ta quête)<textarea id="rv-focus" data-f="focus">${esc(rev.focus)}</textarea></label>
    </div>`;
  $("wprev").onclick = () => { viewWeek = addDays(viewWeek, -7); render(); };
  $("wnext").onclick = () => { viewWeek = addDays(viewWeek, 7); render(); };
  $("wnow").onclick = () => { viewWeek = c.thisWeek; render(); };
  $("p-week").querySelectorAll(".cell").forEach(b => b.onclick = e => toggle(b.dataset.d, b.dataset.h, e));
  $("p-week").querySelectorAll("textarea").forEach(t => {
    const save = () => { if ((state.weeks?.[wk]?.review?.[t.dataset.f] || "") !== t.value) commit({ weeks: { [wk]: { review: { [t.dataset.f]: t.value } } } }, { silent: true }); };
    let tm; t.oninput = () => { clearTimeout(tm); tm = setTimeout(save, 700); };
    t.onblur = () => { clearTimeout(tm); save(); };
  });
}

function renderProgress(c) {
  const won = c.badges.filter(b => b.won), todo = c.badges.filter(b => !b.won).sort((a, b) => b.v / b.goal - a.v / a.goal);
  const badge = b => `<div class="badge ${b.won ? "won" : ""}"><span class="medal"><svg viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round">${BADGE_ICONS[b.icon]}</svg></span><span><b>${esc(b.name)}</b><small>${esc(b.desc)}</small>${b.won ? "" : `<small class="num">${Math.min(b.v, b.goal)}/${b.goal}</small><div class="minibar"><i style="width:${Math.min(100, 100 * b.v / b.goal)}%"></i></div>`}</span></div>`;
  // weekly XP chart with streak status under each bar
  const W = 640, H = 220, padL = 38, padB = 44, padT = 16;
  const vals = c.weeks.map(w => c.weekInfo[w].xp);
  const maxV = Math.max(100, Math.ceil(Math.max(...vals) / 100) * 100);
  const bw = (W - padL - 8) / Math.max(vals.length, 1);
  const y = v => padT + (H - padT - padB) * (1 - v / maxV);
  let grid = "";
  for (let v = 0; v <= maxV; v += maxV / 4) grid += `<line x1="${padL}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${Math.round(v)}</text>`;
  const stColor = { ok: "var(--good)", joker: "var(--ice)", broken: "var(--warn)", miss: "var(--line)", "ok-now": "var(--good)", pending: "var(--line)" };
  const bars = c.weeks.map((w, i) => { const v = vals[i], inf = c.weekInfo[w], x = padL + i * bw + bw * 0.18, bwid = bw * 0.64, cur = w === c.thisWeek;
    return `<rect x="${x}" y="${y(v)}" width="${bwid}" height="${Math.max(0, y(0) - y(v))}" rx="5" fill="var(--xp)" opacity="${cur ? 0.5 : 1}"/>
      <text x="${x + bwid / 2}" y="${y(v) - 5}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" font-family="var(--mono)">${v}</text>
      <text x="${x + bwid / 2}" y="${H - 24}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmt(w)}</text>
      <circle cx="${x + bwid / 2}" cy="${H - 9}" r="5" fill="${stColor[inf.status]}"/>`; }).join("");
  const habits = activeHabits(state).filter(h => h.kind !== "limit");
  const mastery = habits.map(h => {
    const n = c.stats.totals[h.id] || 0, tr = tierOf(n);
    const pct = Math.min(100, 100 * n / 66);
    return `<div class="mrow" style="--c:var(--h-${h.color})"><b>${esc(h.name)}</b><span class="tier" style="color:${TIER_COLORS[tr.name]}">${tr.name}</span>
      <div class="bar"><i style="width:${pct}%"></i>${TIERS.slice(1, -1).map(t => `<s style="left:${100 * t.n / 66}%"></s>`).join("")}</div>
      <small class="num">${n}/66 · ${tr.next ? `${tr.next.n - n} de plus pour ${tr.next.name}` : "automatisme atteint"}</small></div>`;
  }).join("");
  $("p-progress").innerHTML = `
    <div class="kpis">
      <div class="stat"><b>${c.liveStreak}</b><span>semaines de série</span></div>
      <div class="stat"><b>${c.bestStreak}</b><span>meilleure série</span></div>
      <div class="stat"><b>${c.stats.chalDone}</b><span>défis réussis</span></div>
      <div class="stat"><b>${won.length}/${c.badges.length}</b><span>trophées</span></div>
    </div>
    <div class="box chart"><div class="panel-head"><h3>XP par semaine</h3><span class="note"><span style="color:var(--good)">●</span> validée <span style="color:var(--ice)">●</span> joker <span style="color:var(--warn)">●</span> série perdue</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="XP gagnés par semaine et statut de la série">${grid}${bars}</svg></div>
    <div class="box"><div class="panel-head"><h3>Maîtrise des habitudes</h3><span class="note">En moyenne, une habitude devient automatique après environ 66 répétitions.</span></div><div class="mastery">${mastery}</div></div>
    <div class="panel-head"><h2>Trophées</h2></div>
    <div class="badges">${won.map(badge).join("")}${todo.map(badge).join("")}</div>
    <div class="box"><h3>Barème</h3><p class="note">+${XP.check} XP par case · +${XP.goal} par objectif hebdo atteint · +${XP.perfect} pour 7/7 sur une habitude quotidienne · +${XP.combo} par journée à ${COMBO_MIN}+ habitudes · +${XP.limit} par semaine sous une limite. Tout ça est multiplié par ta série : +${Math.round(MULT_STEP * 100)} % par semaine validée, jusqu'à ×${MULT_MAX}. En plus : défis (30 à 60 XP) et coffre du jour (15 à 120 XP). Une semaine est validée quand au moins la moitié des objectifs hebdo sont atteints. Tu gagnes un joker toutes les ${JOKER_EVERY} semaines validées (${JOKER_MAX} max) ; il protège ta série si une semaine n'est pas validée. 1 pièce pour ${COIN_RATE} XP.</p></div>`;
}

function renderShop(c) {
  const rewards = state.rewards || [], purchases = (state.purchases || []).slice().reverse();
  const item = r => {
    const can = c.coins >= r.cost, k = "buy:" + r.id;
    return `<div class="item"><b>${esc(r.name)}</b><div class="row"><span class="price"><svg class="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--gold-bright)"/></svg>${r.cost}</span>
      ${confirmKey === k ? `<span class="confirm"><button class="btn gold" data-buy="${r.id}">Confirmer</button><button class="btn" data-cancel>Annuler</button></span>`
        : can ? `<button class="btn gold" data-ask="${k}">Je me l'offre</button>` : `<span class="note">encore ${r.cost - c.coins} pièces</span>`}</div>
      <button class="btn danger" data-delr="${r.id}" style="justify-self:start;padding:4px 8px;font-size:12px">Supprimer</button></div>`;
  };
  $("p-shop").innerHTML = `
    <div class="panel-head"><div><div class="eyebrow">Boutique</div><h2>${c.coins} pièces à dépenser</h2></div><span class="sub">Tu gagnes 1 pièce pour ${COIN_RATE} XP.</span></div>
    <p class="note">Mets ici de vraies récompenses que tu t'offres quand tu les as gagnées. Choisis des choses qui te font vraiment plaisir, et évite celles qui vont contre tes habitudes.</p>
    ${rewards.length ? `<div class="shop">${rewards.map(item).join("")}</div>` : `<div class="box"><h3>Pas encore de récompense</h3><p class="note">Quelques idées pour commencer. Touche-en une pour l'ajouter.</p><div class="chips">${REWARD_IDEAS.map((r, i) => `<button class="btn" data-idea="${i}">${esc(r.name)} · ${r.cost}</button>`).join("")}</div></div>`}
    <form class="hrow" id="rewardform">
      <h3>Nouvelle récompense</h3>
      <div class="line"><label class="fieldlab" for="rw-name">Récompense<input type="text" id="rw-name" required placeholder="Ex. : Soirée cinéma"></label>
      <label class="fieldlab" for="rw-cost">Prix en pièces<input type="number" id="rw-cost" min="1" max="5000" value="30"></label><span></span></div>
      <div class="line2"><span class="note">Repère : une bonne semaine rapporte environ ${Math.round((c.recordXP || 300) / COIN_RATE)} pièces.</span><button class="btn primary" type="submit">Ajouter</button></div>
    </form>
    ${purchases.length ? `<div class="box"><h3>Récompenses obtenues</h3><div class="hist">${purchases.map(p => `<div><span>${esc(p.name)}</span><span class="note num">${fmt(p.date)} · ${p.cost} pièces</span></div>`).join("")}</div></div>` : ""}`;
  const P = $("p-shop");
  P.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => { confirmKey = b.dataset.ask; render(); });
  P.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => { confirmKey = null; render(); });
  P.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => {
    const r = rewards.find(x => x.id === b.dataset.buy); confirmKey = null;
    const { before, after } = commit({ purchases: [...(state.purchases || []), { id: "p" + Date.now().toString(36), rid: r.id, name: r.name, cost: r.cost, date: todayISO() }] });
    popup("Récompense débloquée", esc(r.name), "Tu l'as gagnée. Profite-en vraiment."); confetti();
    for (const nb of after.badges.filter(x => x.won && !before.badges.find(y => y.id === x.id && y.won))) toast(`Trophée débloqué : ${esc(nb.name)}`, "");
  });
  P.querySelectorAll("[data-delr]").forEach(b => b.onclick = () => commit({ rewards: rewards.filter(r => r.id !== b.dataset.delr) }));
  P.querySelectorAll("[data-idea]").forEach(b => b.onclick = () => { const r = REWARD_IDEAS[+b.dataset.idea]; commit({ rewards: [...rewards, { id: "r" + Date.now().toString(36), ...r }] }); });
  $("rewardform").onsubmit = e => { e.preventDefault(); const name = $("rw-name").value.trim(); if (!name) return; const cost = Math.max(1, Math.min(5000, parseInt($("rw-cost").value, 10) || 30)); commit({ rewards: [...rewards, { id: "r" + Date.now().toString(36), name, cost }] }); };
}

        <label class="fieldlab" for="new-target">Fois / sem.<input type="number" id="new-target" min="1" max="7" value="3"></label>

      <div class="line2"><span class="note">Commence petit : mieux vaut 2 fois par semaine tenues que 5 abandonnées.</span><button class="btn primary" type="submit">Ajouter la quête</button></div>
    </form>
    ${archived.length ? `<div class="hrow"><h3>Habitudes retirées</h3>${archived.map(h => `<div class="line2"><span>${esc(h.name)}</span><button class="btn" data-restore="${h.id}">Réactiver</button></div>`).join("")}</div>` : ""}`;
  const P = $("p-habits");
  P.querySelectorAll("input[data-k], select[data-k]").forEach(el => el.onchange = () => {
    let v = el.value; const k = el.dataset.k;
    if (k === "target") v = Math.max(1, Math.min(7, parseInt(v, 10) || 1));
    if (k === "name" && !v.trim()) { render(); return; }
    if (k === "cue" || k === "identity") v = v.trim();
    const patch = { [k]: v };
    if (k === "kind" && v === "daily") patch.target = 7;
    if (k === "kind" && v !== "daily" && state.habits.find(h => h.id === el.dataset.id).target === 7) patch.target = v === "limit" ? 2 : 3;
    updateHabit(el.dataset.id, patch);
  });
  P.querySelectorAll("[data-col]").forEach(b => b.onclick = () => updateHabit(b.dataset.id, { color: b.dataset.col }));
  P.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => { confirmKey = b.dataset.ask; render(); });
  P.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => { confirmKey = null; render(); });
  P.querySelectorAll("[data-arch]").forEach(b => b.onclick = () => { confirmKey = null; updateHabit(b.dataset.arch, { archived: true }); });
  P.querySelectorAll("[data-restore]").forEach(b => b.onclick = () => updateHabit(b.dataset.restore, { archived: false }));
  $("new-kind").onchange = e => { const t = $("new-target"); t.disabled = e.target.value === "daily"; t.value = e.target.value === "daily" ? 7 : e.target.value === "limit" ? 2 : 3; };
  $("addform").onsubmit = e => {
    e.preventDefault();
    const name = $("new-name").value.trim(); if (!name) return;
    const kind = $("new-kind").value, target = kind === "daily" ? 7 : Math.max(1, Math.min(7, parseInt($("new-target").value, 10) || 3));
    const used = new Set(all.map(h => h.color));
    const color = COLORS.find(col => !used.has(col)) || COLORS[all.length % COLORS.length];
    commit({ habits: [...all, { id: "h" + Date.now().toString(36), name, kind, target, color, since: mondayOf(todayISO()) }] });
    toast(`Nouvelle quête : ${esc(name)}`, "");
  };
}
const CUE_HINTS = { wake: "Ex. : réveil posé loin du lit, debout dès qu'il sonne", phone: "Ex. : à 22 h 45, téléphone en charge dans le salon", read: "Ex. : au lit, avant d'éteindre la lumière", run: "Ex. : mardi et jeudi en rentrant, avant de m'asseoir", gym: "Ex. : lundi, mercredi, vendredi après les cours", protein: "Ex. : shaker au petit-déj, poulet au dîner" };
const ID_HINTS = { wake: "commence ses journées tôt", phone: "protège son sommeil", read: "lit tous les soirs", run: "court régulièrement", gym: "s'entraîne avec constance", protein: "nourrit bien son corps" };
const cueHint = h => CUE_HINTS[h.id] || "Ex. : après mon café du matin, à mon bureau";
const idHint = h => ID_HINTS[h.id] || "tient ses engagements";

// ---------- effects ----------
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function toast(msg, xp) { const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<span>${msg}</span>${xp ? `<b>${xp} XP</b>` : ""}`; $("toasts").appendChild(t); setTimeout(() => t.remove(), 3400); }
function floatXP(evt, text) {
  const r = evt?.currentTarget?.getBoundingClientRect?.(); if (!r) return;
  const f = document.createElement("div"); f.className = "float"; f.textContent = text;
  f.style.left = Math.min(innerWidth - 90, r.right - 80) + "px"; f.style.top = (r.top + r.height / 2 - 10) + "px";
  document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
}
function popup(title, big, line) {
  const o = document.createElement("div"); o.className = "overlay"; o.setAttribute("role", "dialog"); o.setAttribute("aria-label", title);
  o.innerHTML = `<div class="pop"><div class="eyebrow">${title}</div><h2>${big}</h2><p class="sub">${line}</p><button class="btn primary">Continuer</button></div>`;
  document.body.appendChild(o); const close = () => o.remove();
  o.querySelector("button").onclick = close; o.onclick = e => { if (e.target === o) close(); }; o.querySelector("button").focus();
}
function levelUp(lvl) { popup("Niveau supérieur", `Niveau ${lvl}`, `Rang : ${rankOf(lvl)}. Continue comme ça.`); confetti(160); }
function confetti(n = 90) {
  if (reduced) return;
  const cv = $("fx"), ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--xp","--gold-bright","--h-night","--h-leaf","--h-berry","--h-sun"].map(v => cs.getPropertyValue(v).trim());
  const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .45, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .3 }));
  let frames = 0;
  (function step() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.vy += .35; p.vx *= .99; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
    if (++frames < 110) requestAnimationFrame(step); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}
function showBanner(html) { const b = $("banner"); b.className = "banner"; b.innerHTML = html; b.hidden = false; }

// ---------- tabs ----------
const TABS = ["today","week","progress","shop","habits"];
for (const t of TABS) $("tab-" + t).onclick = () => { tab = t; confirmKey = null; try { localStorage.setItem("hq-tab", t); } catch (e) {} render(); };
document.querySelector(".tabs").addEventListener("keydown", e => {
  let i = TABS.indexOf(tab);
  if (e.key === "ArrowRight") i = (i + 1) % TABS.length; else if (e.key === "ArrowLeft") i = (i + TABS.length - 1) % TABS.length; else return;
  tab = TABS[i]; render(); $("tab-" + tab).focus();
});
let lastDay = todayISO();
setInterval(() => { if (todayISO() !== lastDay) { lastDay = todayISO(); viewWeek = mondayOf(lastDay); if (state) render(); } }, 60000);

// ---------- boot ----------
state = lsGet(LS.state); pending = lsGet(LS.pending);
render();
(async () => {
  if (!(CFG.supabaseUrl && CFG.supabaseKey && window.supabase)) {
    mode = state ? "ready" : "missing";
    showBanner("Synchronisation pas encore configurée : ta progression est gardée sur cet appareil uniquement.");
    render(); return;
  }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  sb.auth.onAuthStateChange((event, s2) => {
    const prevId = session && session.user.id;
    session = s2;
    if (s2 && s2.user.id !== prevId) setTimeout(onSignedIn, 0); // don't call Supabase inside this callback
    else if (!s2) { mode = "login"; render(); }
  });
})();
function onSignedIn() {
  const meta = lsGet(LS.meta) || {};
  if (meta.uid && meta.uid !== session.user.id) { state = null; pending = null; lsSet(LS.meta, null); saveLocal(); }
  mode = state ? "ready" : "loading";
  if (document.getElementById("auth")) $("p-today").innerHTML = "";
  render(); sync();
}
addEventListener("online", () => { paintSync(); sync(); });
addEventListener("offline", paintSync);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sync(); });
setInterval(() => { if (document.visibilityState === "visible") sync(); }, 60000);
$("syncline").onclick = () => sync();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
